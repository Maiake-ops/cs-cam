<body>
<main id="app" aria-label="Camera">

  <div class="vignette"></div><div class="brand">CS <span>CAMERA</span></div>
  <div id="photo-stage"></div>
  <section id="card" aria-label="Latest photo" hidden>

    <div id="caption"></div>
  </section>
  <nav id="strip" aria-label="Earlier photos"></nav>
  <div id="camera-controls" hidden>

      <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11a9.5 9.5 0 0 1 16-4l3 3M24 4v6h-6M23 17a9.5 9.5 0 0 1-16 4l-3-3M4 24v-6h6"/></svg>
    </button>
    <button id="chooser" aria-label="Choose camera" aria-haspopup="menu" aria-expanded="false">▾</button>
    <div id="camera-list" class="glass" role="menu" aria-label="Available cameras" hidden></div>
  </div>
  <button id="shutter" aria-label="Take photo (Space)" disabled><span></span></button>
  <section id="error" class="glass" role="alert" hidden><p id="error-message"></p><button id="retry" class="text-button">Retry</button></section>
  <div id="toast" class="glass" role="status" hidden></div>
</main>
<div id="flash"></div>
<dialog id="lightbox" aria-label="Photo viewer">
  <button id="close-lightbox" class="glass" aria-label="Close photo">✕</button>
  <div id="light-content"><div id="light-photo"></div><div id="light-caption"></div><button id="download" class="text-button">Download PNG</button></div>
</dialog>
<svg class="filters" aria-hidden="true"><defs><filter id="warp" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence id="noise" type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="1" result="noise"/><feDisplacementMap id="displacement" in="SourceGraphic" in2="noise" scale="60" xChannelSelector="R" yChannelSelector="G"/></filter></defs></svg>

    <div id="caption"></div>

    <div id="camera-list" class="glass" role="menu" aria-label="Available cameras" hidden></div>
  </div>
  <button id="shutter" aria-label="Take photo (Space)" disabled><span></span></button>
  <section id="error" class="glass" role="alert" hidden><p id="error-message"></p><button id="retry" class="text-button">Retry</button></section>
  <div id="toast" class="glass" role="status" hidden></div>
</main>
<div id="flash"></div>
<dialog id="lightbox" aria-label="Photo viewer">
  <button id="close-lightbox" class="glass" aria-label="Close photo">✕</button>
  <div id="light-content"><div id="light-photo"></div><div id="light-caption"></div><button id="download" class="text-button">Download PNG</button></div>
</dialog>
